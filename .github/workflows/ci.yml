name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install projects and test dependencies
        run: python -m pip install -e . -e ./examples/mini-pico pytest
      - name: Compile
        run: python -m compileall -q pico examples/mini-pico/mini_pico
      - name: Test Pico
        run: python -m pytest tests -q
      - name: Test teaching example
        run: python -m pytest examples/mini-pico/tests -q
